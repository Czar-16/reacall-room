<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="BuzzLine-2-svg-title BuzzLine-2-svg-desc"><title id="BuzzLine-2-svg-title">Debounced user search — timeline</title><desc id="BuzzLine-2-svg-desc">Each new input cancels the pending timer, not an already-started request. The final input at 260 ms runs its callback around 760 ms after 500 ms of quiet. The server authenticates, trims and rejects short queries before regex matching. Results exclude the requester and are capped at eight; the resume timing and text-index claims differ.</desc><style>svg{--ink:#182a44;--paper:#ffffff;--line:#71829a;--blue:#245bb5;--rose:#a02d49;--teal:#087365;--violet:#7541b3;color:var(--ink);background:var(--paper)} text{fill:var(--ink);font:14px system-ui,sans-serif} .node{fill:var(--paper);stroke:var(--blue);stroke-width:1.8}.decision{fill:var(--paper);stroke:var(--blue);stroke-width:2.5}.success{stroke:var(--teal)}.error{stroke:var(--rose)}.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge{fill:none;stroke:var(--line);stroke-width:1.8}.edge.error{stroke:var(--rose)}.edge.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge.response{stroke-dasharray:4 4}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round;font-size:12px}.lifeline{stroke:var(--line);stroke-dasharray:4 6;opacity:.6} @media(prefers-color-scheme:dark){svg{--ink:#e0e9f9;--paper:#162338;--line:#93a4bf;--blue:#8ab8ff;--rose:#ff9cb1;--teal:#6cdecb;--violet:#ccadff}}</style><defs><marker id="BuzzLine-2-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="BuzzLine-2-arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rose)"/></marker><marker id="BuzzLine-2-arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/></marker><marker id="BuzzLine-2-arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path class="edge current" d="M 155 114 L 155 220" marker-end="url(#BuzzLine-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="155.0" y="157.0">next input</text><path class="edge current" d="M 445 114 L 445 220" marker-end="url(#BuzzLine-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="445.0" y="157.0">next input</text><path class="edge current" d="M 735 114 L 735 220" marker-end="url(#BuzzLine-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="735.0" y="157.0">500 ms quiet interval</text><path class="edge current" d="M 735 284 L 735 410" marker-end="url(#BuzzLine-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="735.0" y="337.0">authenticated request</text><path class="edge current" d="M 620 442 L 515 442" marker-end="url(#BuzzLine-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="567.5" y="400">MongoDB query</text><rect class="node process" x="40" y="50" width="230" height="64" rx="10"/><text text-anchor="middle" x="155" y="86">t=0: c</text><rect class="node process" x="330" y="50" width="230" height="64" rx="10"/><text text-anchor="middle" x="445" y="86">t=120: cz</text><rect class="node process" x="620" y="50" width="230" height="64" rx="10"/><text text-anchor="middle" x="735" y="86">t=260: cza</text><rect class="node error" x="40" y="220" width="230" height="64" rx="10"/><text text-anchor="middle" x="155" y="256">Old timer cancelled</text><rect class="node error" x="330" y="220" width="230" height="64" rx="10"/><text text-anchor="middle" x="445" y="256">Old timer cancelled</text><rect class="node process" x="620" y="220" width="230" height="64" rx="10"/><text text-anchor="middle" x="735" y="256">t≈760: fetch q=cza</text><rect class="node process" x="620" y="410" width="230" height="64" rx="10"/><text text-anchor="middle" x="735" y="446">Session + q length ≥ 2</text><rect class="node success" x="285" y="410" width="230" height="64" rx="10"/><text text-anchor="middle" x="400" y="437">Regex i; exclude self; limit</text><text text-anchor="middle" x="400" y="455">8</text></svg>