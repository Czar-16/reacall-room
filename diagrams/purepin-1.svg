<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 648" role="img" aria-labelledby="purepin-1-svg-title purepin-1-svg-desc"><title id="purepin-1-svg-title">Server download proxy — sequence</title><desc id="purepin-1-svg-desc">The client requests a same-origin download using its resolved URL. The shared helper validates destination, each redirect, deadline, size and media type. Valid bytes become an attachment response, then a browser blob. Errors shown at the bottom are route outcomes, not successful file saves.</desc><style>svg{--ink:#182a44;--paper:#ffffff;--line:#71829a;--blue:#245bb5;--rose:#a02d49;--teal:#087365;--violet:#7541b3;color:var(--ink);background:var(--paper)} text{fill:var(--ink);font:14px system-ui,sans-serif} .node{fill:var(--paper);stroke:var(--blue);stroke-width:1.8}.decision{fill:var(--paper);stroke:var(--blue);stroke-width:2.5}.success{stroke:var(--teal)}.error{stroke:var(--rose)}.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge{fill:none;stroke:var(--line);stroke-width:1.8}.edge.error{stroke:var(--rose)}.edge.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge.response{stroke-dasharray:4 4}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round;font-size:12px}.lifeline{stroke:var(--line);stroke-dasharray:4 6;opacity:.6} @media(prefers-color-scheme:dark){svg{--ink:#e0e9f9;--paper:#162338;--line:#93a4bf;--blue:#8ab8ff;--rose:#ff9cb1;--teal:#6cdecb;--violet:#ccadff}}</style><defs><marker id="purepin-1-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="purepin-1-arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rose)"/></marker><marker id="purepin-1-arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/></marker><marker id="purepin-1-arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path class="lifeline" d="M 145 82 V 633"/><path class="lifeline" d="M 385 82 V 633"/><path class="lifeline" d="M 625 82 V 633"/><path class="lifeline" d="M 865 82 V 633"/><path class="edge current" d="M 145 118 L 385 118" marker-end="url(#purepin-1-arrow-current)"/><text class="edge-label" text-anchor="middle" x="265.0" y="108">1. Query: resolved image URL</text><path class="edge current" d="M 385 184 L 625 184" marker-end="url(#purepin-1-arrow-current)"/><text class="edge-label" text-anchor="middle" x="505.0" y="174">2. GET with validated destination</text><path class="edge current" d="M 625 250 L 865 250" marker-end="url(#purepin-1-arrow-current)"/><text class="edge-label" text-anchor="middle" x="745.0" y="240">3. Fetch: deadline + 32 MiB bound</text><path class="edge response" d="M 865 316 L 625 316" marker-end="url(#purepin-1-arrow-response)"/><text class="edge-label" text-anchor="middle" x="745.0" y="306">4. Redirect? validate each hop (max 5)</text><path class="edge response" d="M 865 382 L 625 382" marker-end="url(#purepin-1-arrow-response)"/><text class="edge-label" text-anchor="middle" x="745.0" y="372">5. Allowed image MIME + bytes</text><path class="edge response" d="M 625 448 L 385 448" marker-end="url(#purepin-1-arrow-response)"/><text class="edge-label" text-anchor="middle" x="505.0" y="438">6. Validated format and byte buffer</text><path class="edge response" d="M 385 514 L 145 514" marker-end="url(#purepin-1-arrow-response)"/><text class="edge-label" text-anchor="middle" x="265.0" y="504">7. Attachment + type + nosniff → blob</text><path class="edge error" d="M 625 580 L 145 580" marker-end="url(#purepin-1-arrow-error)"/><text class="edge-label" text-anchor="middle" x="385.0" y="570">Error: invalid 400 / timeout 504 / size 413</text><rect class="node actor" x="30" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="145" y="54">Browser / ImageCard</text><rect class="node actor" x="270" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="385" y="54">GET /api/download</text><rect class="node actor" x="510" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="625" y="54">requestPinterestImage</text><rect class="node actor" x="750" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="865" y="54">Pinterest CDN</text></svg>