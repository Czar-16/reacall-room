<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="mailloop-1-svg-title mailloop-1-svg-desc"><title id="mailloop-1-svg-title">Durable background delivery — state</title><desc id="mailloop-1-svg-desc">A queued send is claimed before an external Gmail attempt. A provider ID supplies acceptance evidence; the worker settles receipt and usage. Settlement can still fail. Lost responses can leave an uncertain outcome; the review path prevents automatic resends. The dashed review-tooling node is a proposal. This is a conceptual state map, not every ledger enum.</desc><style>svg{--ink:#182a44;--paper:#ffffff;--line:#71829a;--blue:#245bb5;--rose:#a02d49;--teal:#087365;--violet:#7541b3;color:var(--ink);background:var(--paper)} text{fill:var(--ink);font:14px system-ui,sans-serif} .node{fill:var(--paper);stroke:var(--blue);stroke-width:1.8}.decision{fill:var(--paper);stroke:var(--blue);stroke-width:2.5}.success{stroke:var(--teal)}.error{stroke:var(--rose)}.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge{fill:none;stroke:var(--line);stroke-width:1.8}.edge.error{stroke:var(--rose)}.edge.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge.response{stroke-dasharray:4 4}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round;font-size:12px}.lifeline{stroke:var(--line);stroke-dasharray:4 6;opacity:.6} @media(prefers-color-scheme:dark){svg{--ink:#e0e9f9;--paper:#162338;--line:#93a4bf;--blue:#8ab8ff;--rose:#ff9cb1;--teal:#6cdecb;--violet:#ccadff}}</style><defs><marker id="mailloop-1-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="mailloop-1-arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rose)"/></marker><marker id="mailloop-1-arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/></marker><marker id="mailloop-1-arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path class="edge current" d="M 280 82 L 385 82" marker-end="url(#mailloop-1-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="40">claim</text><path class="edge current" d="M 615 82 L 720 82" marker-end="url(#mailloop-1-arrow-current)"/><text class="edge-label" text-anchor="middle" x="667.5" y="40">attempt</text><path class="edge current" d="M 835 114 L 835 240" marker-end="url(#mailloop-1-arrow-current)"/><text class="edge-label" text-anchor="middle" x="835.0" y="167.0">provider ID</text><path class="edge error" d="M 760 114 L 760 170 L 500 170 L 500 240" marker-end="url(#mailloop-1-arrow-error)"/><text class="edge-label" text-anchor="middle" x="630.0" y="160.0">explicit rejection</text><path class="edge error" d="M 950 82 L 980 82 L 980 205 L 165 205 L 165 240" marker-end="url(#mailloop-1-arrow-error)"/><text class="edge-label" text-anchor="middle" x="572.5" y="195.0">response lost / outcome unknown</text><path class="edge error" d="M 165 304 L 165 440" marker-end="url(#mailloop-1-arrow-error)"/><text class="edge-label" text-anchor="middle" x="170" y="408">preserve ambiguity</text><path class="edge current" d="M 835 304 L 835 440" marker-end="url(#mailloop-1-arrow-current)"/><text class="edge-label" text-anchor="middle" x="835.0" y="362.0">known acceptance</text><path class="edge proposed" d="M 280 472 L 385 472" marker-end="url(#mailloop-1-arrow-proposed)"/><text class="edge-label" text-anchor="middle" x="332.5" y="430">manual inspection</text><path class="edge error" d="M 720 272 L 670 272 L 670 365 L 30 365 L 30 272 L 50 272" marker-end="url(#mailloop-1-arrow-error)"/><text class="edge-label" text-anchor="middle" x="500" y="355">settlement fails; evidence may be incomplete</text><rect class="node process" x="50" y="50" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="86">QUEUED / awaiting claim</text><rect class="node process" x="385" y="50" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="86">ATTEMPTING / worker claim</text><rect class="node process" x="720" y="50" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="86">Gmail send request</text><rect class="node success" x="720" y="240" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="276">Accepted + ID recorded</text><rect class="node error" x="385" y="240" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="276">Confirmed failure</text><rect class="node error" x="50" y="240" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="276">UNCERTAIN / needs review</text><rect class="node error" x="50" y="440" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="476">No automatic resend</text><rect class="node success" x="720" y="440" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="476">Settle usage / receipt</text><rect class="node proposed" x="385" y="440" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="476">Proposed: review tooling</text></svg>