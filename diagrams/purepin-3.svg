<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" role="img" aria-labelledby="purepin-3-svg-title purepin-3-svg-desc"><title id="purepin-3-svg-title">Progress UI and validation — state</title><desc id="purepin-3-svg-desc">Input validation and resolution produce a preview before a separate download starts. Known byte totals yield a measured fraction; unknown totals use a capped approximation in current code. A completed blob is handed off through an object URL, then the anchor and URL are cleaned up. The finally timer resets state after 400 ms. Cancellation guards are proposed; state names are explanatory.</desc><style>svg{--ink:#182a44;--paper:#ffffff;--line:#71829a;--blue:#245bb5;--rose:#a02d49;--teal:#087365;--violet:#7541b3;color:var(--ink);background:var(--paper)} text{fill:var(--ink);font:14px system-ui,sans-serif} .node{fill:var(--paper);stroke:var(--blue);stroke-width:1.8}.decision{fill:var(--paper);stroke:var(--blue);stroke-width:2.5}.success{stroke:var(--teal)}.error{stroke:var(--rose)}.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge{fill:none;stroke:var(--line);stroke-width:1.8}.edge.error{stroke:var(--rose)}.edge.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge.response{stroke-dasharray:4 4}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round;font-size:12px}.lifeline{stroke:var(--line);stroke-dasharray:4 6;opacity:.6} @media(prefers-color-scheme:dark){svg{--ink:#e0e9f9;--paper:#162338;--line:#93a4bf;--blue:#8ab8ff;--rose:#ff9cb1;--teal:#6cdecb;--violet:#ccadff}}</style><defs><marker id="purepin-3-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="purepin-3-arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rose)"/></marker><marker id="purepin-3-arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/></marker><marker id="purepin-3-arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path class="edge current" d="M 280 62 L 385 62" marker-end="url(#purepin-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="20">submit</text><path class="edge current" d="M 615 62 L 720 62" marker-end="url(#purepin-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="667.5" y="20">verified result</text><path class="edge current" d="M 835 94 L 835 230" marker-end="url(#purepin-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="835.0" y="152.0">download click</text><path class="edge current" d="M 720 262 L 615 262" marker-end="url(#purepin-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="667.5" y="220">full response</text><path class="edge current" d="M 385 262 L 280 262" marker-end="url(#purepin-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="220">handoff</text><path class="edge current" d="M 165 294 L 165 370 L 500 370 L 500 435" marker-end="url(#purepin-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="360.0">set 100; finally</text><path class="edge error" d="M 835 294 L 835 435" marker-end="url(#purepin-3-arrow-error)"/><text class="edge-label" text-anchor="middle" x="835.0" y="354.5">reject</text><path class="edge current" d="M 720 467 L 615 467" marker-end="url(#purepin-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="667.5" y="425">finally</text><path class="edge proposed" d="M 385 467 L 280 467" marker-end="url(#purepin-3-arrow-proposed)"/><text class="edge-label" text-anchor="middle" x="332.5" y="425">lifecycle improvement</text><path class="edge error" d="M 500 94 L 500 160 L 975 160 L 975 405 L 850 405 L 850 435" marker-end="url(#purepin-3-arrow-error)"/><text class="edge-label" text-anchor="middle" x="737.5" y="150.0">invalid / resolution fails</text><rect class="node process" x="50" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="66">Input / ready</text><rect class="node process" x="385" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="66">Validating + resolving</text><rect class="node success" x="720" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="66">Resolved preview</text><rect class="node process" x="720" y="230" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="266">Downloading bytes</text><rect class="node process" x="385" y="230" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="266">Blob → object URL → click</text><rect class="node success" x="50" y="230" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="266">Remove anchor; revoke URL</text><rect class="node error" x="720" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="471">Error feedback</text><rect class="node process" x="385" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="471">400 ms timer → reset state</text><rect class="node proposed" x="50" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="471">Proposed: cancel stale work</text></svg>