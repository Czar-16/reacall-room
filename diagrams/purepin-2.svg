<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" role="img" aria-labelledby="purepin-2-svg-title purepin-2-svg-desc"><title id="purepin-2-svg-title">Pin resolution and fallback — flowchart</title><desc id="purepin-2-svg-desc">Classify image, pin page or short-link input under one shared deadline. Page inputs follow permitted redirects and metadata extraction; direct images skip those steps. Probe originals, then verify the source preview if budget remains. Missing metadata, exhausted time and unavailable images terminate with explicit errors.</desc><style>svg{--ink:#182a44;--paper:#ffffff;--line:#71829a;--blue:#245bb5;--rose:#a02d49;--teal:#087365;--violet:#7541b3;color:var(--ink);background:var(--paper)} text{fill:var(--ink);font:14px system-ui,sans-serif} .node{fill:var(--paper);stroke:var(--blue);stroke-width:1.8}.decision{fill:var(--paper);stroke:var(--blue);stroke-width:2.5}.success{stroke:var(--teal)}.error{stroke:var(--rose)}.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge{fill:none;stroke:var(--line);stroke-width:1.8}.edge.error{stroke:var(--rose)}.edge.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge.response{stroke-dasharray:4 4}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round;font-size:12px}.lifeline{stroke:var(--line);stroke-dasharray:4 6;opacity:.6} @media(prefers-color-scheme:dark){svg{--ink:#e0e9f9;--paper:#162338;--line:#93a4bf;--blue:#8ab8ff;--rose:#ff9cb1;--teal:#6cdecb;--violet:#ccadff}}</style><defs><marker id="purepin-2-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="purepin-2-arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rose)"/></marker><marker id="purepin-2-arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/></marker><marker id="purepin-2-arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path class="edge current" d="M 280 62 L 385 62" marker-end="url(#purepin-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="20">start shared deadline</text><path class="edge current" d="M 615 62 L 720 62" marker-end="url(#purepin-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="667.5" y="20">page / short link</text><path class="edge current" d="M 835 94 L 835 230" marker-end="url(#purepin-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="835.0" y="152.0">allowed redirects only</text><path class="edge current" d="M 500 94 L 500 230" marker-end="url(#purepin-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="500.0" y="152.0">direct image</text><path class="edge current" d="M 720 262 L 615 262" marker-end="url(#purepin-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="667.5" y="220">image URL found</text><path class="edge current" d="M 385 262 L 280 262" marker-end="url(#purepin-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="220">verified</text><path class="edge error" d="M 500 294 L 500 435" marker-end="url(#purepin-2-arrow-error)"/><text class="edge-label" text-anchor="middle" x="500.0" y="354.5">originals fail</text><path class="edge current" d="M 385 467 L 280 467" marker-end="url(#purepin-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="425">verified</text><path class="edge error" d="M 615 467 L 720 467" marker-end="url(#purepin-2-arrow-error)"/><text class="edge-label" text-anchor="middle" x="667.5" y="425">fails / deadline</text><path class="edge error" d="M 950 262 L 975 262 L 975 405 L 835 405 L 835 435" marker-end="url(#purepin-2-arrow-error)"/><text class="edge-label" text-anchor="middle" x="905.0" y="395.0">no metadata</text><rect class="node process" x="50" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="66">Parse Pinterest input</text><rect class="node decision" x="385" y="30" width="230" height="64" rx="24"/><text text-anchor="middle" x="500" y="66">Direct image or page?</text><rect class="node process" x="720" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="66">Pin / pin.it: fetch page</text><rect class="node process" x="720" y="230" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="266">Extract image metadata</text><rect class="node process" x="385" y="230" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="266">Probe original candidates</text><rect class="node success" x="50" y="230" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="266">Verified original</text><rect class="node process" x="385" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="471">Verify source preview</text><rect class="node success" x="50" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="471">Return honest preview label</text><rect class="node error" x="720" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="462">Missing / unavailable /</text><text text-anchor="middle" x="835" y="480">timeout</text></svg>