<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 648" role="img" aria-labelledby="BuzzLine-3-svg-title BuzzLine-3-svg-desc"><title id="BuzzLine-3-svg-title">Online presence — sequence</title><desc id="BuzzLine-3-svg-desc">Two sockets register the same user, each causing an online write. Closing the first tab writes offline even though the second tab is connected. Deleting only the first mapping does not fix the false offline write. The dashed final event proposes verified per-user connection counting; startup also resets everyone offline.</desc><style>svg{--ink:#182a44;--paper:#ffffff;--line:#71829a;--blue:#245bb5;--rose:#a02d49;--teal:#087365;--violet:#7541b3;color:var(--ink);background:var(--paper)} text{fill:var(--ink);font:14px system-ui,sans-serif} .node{fill:var(--paper);stroke:var(--blue);stroke-width:1.8}.decision{fill:var(--paper);stroke:var(--blue);stroke-width:2.5}.success{stroke:var(--teal)}.error{stroke:var(--rose)}.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge{fill:none;stroke:var(--line);stroke-width:1.8}.edge.error{stroke:var(--rose)}.edge.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge.response{stroke-dasharray:4 4}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round;font-size:12px}.lifeline{stroke:var(--line);stroke-dasharray:4 6;opacity:.6} @media(prefers-color-scheme:dark){svg{--ink:#e0e9f9;--paper:#162338;--line:#93a4bf;--blue:#8ab8ff;--rose:#ff9cb1;--teal:#6cdecb;--violet:#ccadff}}</style><defs><marker id="BuzzLine-3-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="BuzzLine-3-arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rose)"/></marker><marker id="BuzzLine-3-arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/></marker><marker id="BuzzLine-3-arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path class="lifeline" d="M 145 82 V 633"/><path class="lifeline" d="M 385 82 V 633"/><path class="lifeline" d="M 625 82 V 633"/><path class="lifeline" d="M 865 82 V 633"/><path class="edge current" d="M 145 118 L 625 118" marker-end="url(#BuzzLine-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="385.0" y="108">1. user-connected(Alice): map T1 → Alice</text><path class="edge current" d="M 625 184 L 865 184" marker-end="url(#BuzzLine-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="745.0" y="174">2. isOnline true; user-online</text><path class="edge current" d="M 385 250 L 625 250" marker-end="url(#BuzzLine-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="505.0" y="240">3. user-connected(Alice): map T2 → Alice</text><path class="edge current" d="M 625 316 L 865 316" marker-end="url(#BuzzLine-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="745.0" y="306">4. isOnline true again</text><path class="edge current" d="M 145 382 L 625 382" marker-end="url(#BuzzLine-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="385.0" y="372">5. T1 disconnects; T2 remains connected</text><path class="edge error" d="M 625 448 L 865 448" marker-end="url(#BuzzLine-3-arrow-error)"/><text class="edge-label" text-anchor="middle" x="745.0" y="438">6. isOnline false + lastActive; user-offline</text><path class="edge current" d="M 625 514 L 715 514 L 715 539 L 625 539" marker-end="url(#BuzzLine-3-arrow-current)"/><text class="edge-label" text-anchor="middle" x="625" y="504">7. Delete T1 mapping; no per-user count</text><path class="edge proposed" d="M 625 580 L 865 580" marker-end="url(#BuzzLine-3-arrow-proposed)"/><text class="edge-label" text-anchor="middle" x="745.0" y="570">Proposed: offline only after final verified socket</text><rect class="node actor" x="30" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="145" y="54">Alice: tab T1</text><rect class="node actor" x="270" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="385" y="54">Alice: tab T2</text><rect class="node actor" x="510" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="625" y="54">Socket server / map</text><rect class="node actor" x="750" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="865" y="54">MongoDB + broadcasts</text></svg>