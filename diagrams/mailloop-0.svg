<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 648" role="img" aria-labelledby="mailloop-0-svg-title mailloop-0-svg-desc"><title id="mailloop-0-svg-title">Personalized outreach and CSV imports — sequence</title><desc id="mailloop-0-svg-desc">The browser submits a logical campaign request with an idempotency key. The server coordinates owner-scoped validation and database writes, including allowance reservation. After commit, background dispatch processes separate recipient sends. The returned campaign ID is not proof of delivery. Invalid ownership, plan or allowance stops creation; repeated keys use the existing campaign.</desc><style>svg{--ink:#182a44;--paper:#ffffff;--line:#71829a;--blue:#245bb5;--rose:#a02d49;--teal:#087365;--violet:#7541b3;color:var(--ink);background:var(--paper)} text{fill:var(--ink);font:14px system-ui,sans-serif} .node{fill:var(--paper);stroke:var(--blue);stroke-width:1.8}.decision{fill:var(--paper);stroke:var(--blue);stroke-width:2.5}.success{stroke:var(--teal)}.error{stroke:var(--rose)}.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge{fill:none;stroke:var(--line);stroke-width:1.8}.edge.error{stroke:var(--rose)}.edge.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge.response{stroke-dasharray:4 4}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round;font-size:12px}.lifeline{stroke:var(--line);stroke-dasharray:4 6;opacity:.6} @media(prefers-color-scheme:dark){svg{--ink:#e0e9f9;--paper:#162338;--line:#93a4bf;--blue:#8ab8ff;--rose:#ff9cb1;--teal:#6cdecb;--violet:#ccadff}}</style><defs><marker id="mailloop-0-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="mailloop-0-arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rose)"/></marker><marker id="mailloop-0-arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/></marker><marker id="mailloop-0-arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path class="lifeline" d="M 145 82 V 633"/><path class="lifeline" d="M 385 82 V 633"/><path class="lifeline" d="M 625 82 V 633"/><path class="lifeline" d="M 865 82 V 633"/><path class="edge current" d="M 145 118 L 385 118" marker-end="url(#mailloop-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="265.0" y="108">1. Submit template + contacts + key</text><path class="edge current" d="M 385 184 L 625 184" marker-end="url(#mailloop-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="505.0" y="174">2. Owner lock; check repeated key</text><path class="edge current" d="M 625 250 L 385 250" marker-end="url(#mailloop-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="505.0" y="240">3. Existing campaign or new-work path</text><path class="edge current" d="M 385 316 L 625 316" marker-end="url(#mailloop-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="505.0" y="306">4. Validate ownership; write sends + reserve</text><path class="edge current" d="M 625 382 L 385 382" marker-end="url(#mailloop-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="505.0" y="372">5. Commit campaign and usage together</text><path class="edge response" d="M 385 448 L 145 448" marker-end="url(#mailloop-0-arrow-response)"/><text class="edge-label" text-anchor="middle" x="265.0" y="438">6. Return campaign ID; not delivery proof</text><path class="edge current" d="M 625 514 L 865 514" marker-end="url(#mailloop-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="745.0" y="504">7. Pending dispatch → per-recipient work</text><path class="edge error" d="M 385 580 L 145 580" marker-end="url(#mailloop-0-arrow-error)"/><text class="edge-label" text-anchor="middle" x="265.0" y="570">Error: invalid contact / plan / allowance</text><rect class="node actor" x="30" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="145" y="54">Browser / composer</text><rect class="node actor" x="270" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="385" y="54">createCampaign</text><rect class="node actor" x="510" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="625" y="54">PostgreSQL</text><rect class="node actor" x="750" y="18" width="230" height="64" rx="10"/><text text-anchor="middle" x="865" y="54">Background worker</text></svg>