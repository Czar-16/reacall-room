<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" role="img" aria-labelledby="purepin-0-svg-title purepin-0-svg-desc"><title id="purepin-0-svg-title">Original image URL generation — flowchart</title><desc id="purepin-0-svg-desc">Validate the source and derive original candidates without generating pixels. Probe each unique format with bounded HEAD requests. Return a verified original, or verify the exact preview as fallback. If neither path verifies, return an error; path naming alone proves nothing.</desc><style>svg{--ink:#182a44;--paper:#ffffff;--line:#71829a;--blue:#245bb5;--rose:#a02d49;--teal:#087365;--violet:#7541b3;color:var(--ink);background:var(--paper)} text{fill:var(--ink);font:14px system-ui,sans-serif} .node{fill:var(--paper);stroke:var(--blue);stroke-width:1.8}.decision{fill:var(--paper);stroke:var(--blue);stroke-width:2.5}.success{stroke:var(--teal)}.error{stroke:var(--rose)}.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge{fill:none;stroke:var(--line);stroke-width:1.8}.edge.error{stroke:var(--rose)}.edge.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge.response{stroke-dasharray:4 4}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round;font-size:12px}.lifeline{stroke:var(--line);stroke-dasharray:4 6;opacity:.6} @media(prefers-color-scheme:dark){svg{--ink:#e0e9f9;--paper:#162338;--line:#93a4bf;--blue:#8ab8ff;--rose:#ff9cb1;--teal:#6cdecb;--violet:#ccadff}}</style><defs><marker id="purepin-0-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="purepin-0-arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rose)"/></marker><marker id="purepin-0-arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/></marker><marker id="purepin-0-arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path class="edge current" d="M 280 62 L 385 62" marker-end="url(#purepin-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="20">validate; strip fragment</text><path class="edge current" d="M 615 62 L 720 62" marker-end="url(#purepin-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="667.5" y="20">deduplicate formats</text><path class="edge current" d="M 835 94 L 835 230" marker-end="url(#purepin-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="835.0" y="152.0">next candidate</text><path class="edge current" d="M 720 262 L 615 262" marker-end="url(#purepin-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="667.5" y="220">status + MIME + URL</text><path class="edge current" d="M 385 262 L 280 262" marker-end="url(#purepin-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="220">yes</text><path class="edge error" d="M 500 294 L 500 435" marker-end="url(#purepin-0-arrow-error)"/><text class="edge-label" text-anchor="middle" x="500.0" y="354.5">all candidates fail</text><path class="edge current" d="M 385 467 L 280 467" marker-end="url(#purepin-0-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="425">verified</text><path class="edge error" d="M 615 467 L 720 467" marker-end="url(#purepin-0-arrow-error)"/><text class="edge-label" text-anchor="middle" x="667.5" y="425">unavailable / timeout</text><rect class="node process" x="50" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="66">HTTPS i.pinimg.com URL</text><rect class="node process" x="385" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="66">Rewrite size → originals</text><rect class="node process" x="720" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="66">PNG / JPG / source extension</text><rect class="node process" x="720" y="230" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="266">Bounded HEAD probe</text><rect class="node decision" x="385" y="230" width="230" height="64" rx="24"/><text text-anchor="middle" x="500" y="266">Valid original response?</text><rect class="node success" x="50" y="230" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="266">Return quality: original</text><rect class="node process" x="385" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="471">Probe exact source preview</text><rect class="node error" x="720" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="471">Neither valid → error</text><rect class="node success" x="50" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="471">Return quality: preview</text></svg>