<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" role="img" aria-labelledby="mailloop-2-svg-title mailloop-2-svg-desc"><title id="mailloop-2-svg-title">Transactional quotas and billing — flowchart</title><desc id="mailloop-2-svg-desc">Competing campaign requests acquire owner coordination before reading allowance. The first eligible request reserves the last slot; the next must see updated usage. Worker outcomes settle the reservation according to ledger policy. A separately signed billing event changes entitlement; invalid signatures are rejected.</desc><style>svg{--ink:#182a44;--paper:#ffffff;--line:#71829a;--blue:#245bb5;--rose:#a02d49;--teal:#087365;--violet:#7541b3;color:var(--ink);background:var(--paper)} text{fill:var(--ink);font:14px system-ui,sans-serif} .node{fill:var(--paper);stroke:var(--blue);stroke-width:1.8}.decision{fill:var(--paper);stroke:var(--blue);stroke-width:2.5}.success{stroke:var(--teal)}.error{stroke:var(--rose)}.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge{fill:none;stroke:var(--line);stroke-width:1.8}.edge.error{stroke:var(--rose)}.edge.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge.response{stroke-dasharray:4 4}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round;font-size:12px}.lifeline{stroke:var(--line);stroke-dasharray:4 6;opacity:.6} @media(prefers-color-scheme:dark){svg{--ink:#e0e9f9;--paper:#162338;--line:#93a4bf;--blue:#8ab8ff;--rose:#ff9cb1;--teal:#6cdecb;--violet:#ccadff}}</style><defs><marker id="mailloop-2-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="mailloop-2-arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rose)"/></marker><marker id="mailloop-2-arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/></marker><marker id="mailloop-2-arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path class="edge current" d="M 280 62 L 385 62" marker-end="url(#mailloop-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="20">serialize requests</text><path class="edge current" d="M 615 62 L 720 62" marker-end="url(#mailloop-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="667.5" y="20">read sent + reserved</text><path class="edge current" d="M 835 94 L 835 225" marker-end="url(#mailloop-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="835.0" y="149.5">yes: first request</text><path class="edge error" d="M 720 72 L 680 72 L 680 175 L 500 175 L 500 225" marker-end="url(#mailloop-2-arrow-error)"/><text class="edge-label" text-anchor="middle" x="590.0" y="165.0">no: later request</text><path class="edge current" d="M 835 289 L 835 435" marker-end="url(#mailloop-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="835.0" y="352.0">commit → worker</text><path class="edge current" d="M 280 467 L 385 467" marker-end="url(#mailloop-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="425">valid signature</text><path class="edge error" d="M 165 435 L 165 289" marker-end="url(#mailloop-2-arrow-error)"/><text class="edge-label" text-anchor="middle" x="165.0" y="352.0">invalid</text><path class="edge current" d="M 500 435 L 500 370 L 330 370 L 330 140 L 500 140 L 500 94" marker-end="url(#mailloop-2-arrow-current)"/><text class="edge-label" text-anchor="middle" x="415.0" y="360.0">future requests use new access</text><rect class="node process" x="50" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="66">R1 and R2: one slot left</text><rect class="node process" x="385" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="66">Owner-locked transaction</text><rect class="node decision" x="720" y="30" width="230" height="64" rx="24"/><text text-anchor="middle" x="835" y="66">Allowance available?</text><rect class="node process" x="720" y="225" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="261">Reserve + create sends</text><rect class="node error" x="385" y="225" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="261">Reject second reservation</text><rect class="node success" x="720" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="471">Delivery → settle ledger</text><rect class="node process" x="50" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="471">Signed billing webhook</text><rect class="node success" x="385" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="471">Verify → update entitlement</text><rect class="node error" x="50" y="225" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="261">Invalid signature → reject</text></svg>