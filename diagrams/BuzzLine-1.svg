<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" role="img" aria-labelledby="BuzzLine-1-svg-title BuzzLine-1-svg-desc"><title id="BuzzLine-1-svg-title">Dual authentication — flowchart</title><desc id="BuzzLine-1-svg-desc">Credentials and Google converge on session identity through different verification paths. HTTP handlers must verify sessions and independently authorize the requested resource. The separate socket path currently trusts supplied IDs; that is an implementation gap. Dashed handshake and membership nodes show required safeguards, not proven universal enforcement.</desc><style>svg{--ink:#182a44;--paper:#ffffff;--line:#71829a;--blue:#245bb5;--rose:#a02d49;--teal:#087365;--violet:#7541b3;color:var(--ink);background:var(--paper)} text{fill:var(--ink);font:14px system-ui,sans-serif} .node{fill:var(--paper);stroke:var(--blue);stroke-width:1.8}.decision{fill:var(--paper);stroke:var(--blue);stroke-width:2.5}.success{stroke:var(--teal)}.error{stroke:var(--rose)}.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge{fill:none;stroke:var(--line);stroke-width:1.8}.edge.error{stroke:var(--rose)}.edge.proposed{stroke:var(--violet);stroke-dasharray:7 4}.edge.response{stroke-dasharray:4 4}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round;font-size:12px}.lifeline{stroke:var(--line);stroke-dasharray:4 6;opacity:.6} @media(prefers-color-scheme:dark){svg{--ink:#e0e9f9;--paper:#162338;--line:#93a4bf;--blue:#8ab8ff;--rose:#ff9cb1;--teal:#6cdecb;--violet:#ccadff}}</style><defs><marker id="BuzzLine-1-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="BuzzLine-1-arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rose)"/></marker><marker id="BuzzLine-1-arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/></marker><marker id="BuzzLine-1-arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path class="edge current" d="M 280 62 L 385 62" marker-end="url(#BuzzLine-1-arrow-current)"/><text class="edge-label" text-anchor="middle" x="332.5" y="20">valid credentials</text><path class="edge current" d="M 280 262 L 330 262 L 330 110 L 500 110 L 500 94" marker-end="url(#BuzzLine-1-arrow-current)"/><text class="edge-label" text-anchor="middle" x="410" y="140">provider identity</text><path class="edge current" d="M 615 62 L 720 62" marker-end="url(#BuzzLine-1-arrow-current)"/><text class="edge-label" text-anchor="middle" x="667.5" y="20">getServerSession</text><path class="edge proposed" d="M 835 94 L 835 230" marker-end="url(#BuzzLine-1-arrow-proposed)"/><text class="edge-label" text-anchor="middle" x="835.0" y="152.0">audit each route</text><path class="edge error" d="M 615 467 L 720 467" marker-end="url(#BuzzLine-1-arrow-error)"/><text class="edge-label" text-anchor="middle" x="667.5" y="425">no verified handshake shown</text><path class="edge proposed" d="M 280 467 L 385 467" marker-end="url(#BuzzLine-1-arrow-proposed)"/><text class="edge-label" text-anchor="middle" x="332.5" y="425">bind trusted identity</text><path class="edge proposed" d="M 835 294 L 835 435" marker-end="url(#BuzzLine-1-arrow-proposed)"/><text class="edge-label" text-anchor="middle" x="835.0" y="354.5">socket needs independent checks</text><rect class="node process" x="50" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="57">Credentials → hash</text><text text-anchor="middle" x="165" y="75">verification</text><rect class="node process" x="50" y="230" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="266">Google → identity callback</text><rect class="node process" x="385" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="66">NextAuth JWT / session ID</text><rect class="node process" x="720" y="30" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="66">HTTP protected route</text><rect class="node proposed" x="720" y="230" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="257">Required: resource</text><text text-anchor="middle" x="835" y="275">membership</text><rect class="node process" x="385" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="500" y="471">Separate socket connection</text><rect class="node error" x="720" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="835" y="462">Current: supplied user /</text><text text-anchor="middle" x="835" y="480">room ID</text><rect class="node proposed" x="50" y="435" width="230" height="64" rx="10"/><text text-anchor="middle" x="165" y="471">Proposed: verified handshake</text></svg>